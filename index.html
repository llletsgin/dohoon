<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>도뤵아 생일축하해</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}

.phone {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    max-height: 932px;
    background: #dff7c8;
    position: relative;
    overflow: hidden;
}


/* 시작 화면 */

#startScreen {
    height: 100%;
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    background:
        linear-gradient(#bff3ff, #e7ffd8 45%, #fff3be);
}

.start-title {
    font-size: 36px;
    font-weight: 900;
    line-height: 1.35;
    margin-bottom: 18px;
}

.start-text {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 34px;
    color: #444;
}

.main-button {
    border: 0;
    border-radius: 18px;
    background: #2f9e44;
    color: white;
    font-size: 21px;
    font-weight: 900;
    padding: 17px 20px;
    cursor: pointer;
    box-shadow: 0 5px 0 #1f6f30;
}

.main-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #1f6f30;
}


/* 맵 화면 */

#mapScreen {
    display: none;
    height: 100%;
    position: relative;
    background: #111;
    overflow: hidden;
}

.map {
    position: absolute;
    inset: 0;
    background-image: url("map.png");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}


/* 안내문 */

.top-ui {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    z-index: 8;
    background: rgba(255,255,255,.92);
    border: 3px solid #333;
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 900;
    line-height: 1.45;
}


/* 플레이어 */

.player {
    position: absolute;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: #ffd166;
    border: 3px solid #222;
    z-index: 7;
    left: 205px;
    top: 700px;
    transition: left .18s linear, top .18s linear;
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
}

.player::before {
    content: "윤";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 19px;
    font-weight: 900;
}

.player.walk {
    animation: walk .25s alternate infinite;
}

@keyframes walk {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-4px);
    }
}


/* 방향키 */

.controls {
    position: absolute;
    bottom: 24px;
    left: 18px;
    z-index: 9;
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 6px;
}

.ctrl {
    border: 3px solid #333;
    background: rgba(255,255,255,.92);
    border-radius: 14px;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
}

.ctrl:active {
    background: #ffe066;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 3;
}

.hint {
    position: absolute;
    right: 18px;
    bottom: 42px;
    z-index: 9;
    width: 150px;
    background: rgba(255,255,255,.92);
    border: 3px solid #333;
    border-radius: 16px;
    padding: 10px;
    font-size: 13px;
    font-weight: 900;
    line-height: 1.45;
}


/* 배틀 화면 */

#battleScreen {
    display: none;
    height: 100%;
    background: #222;
    position: relative;
    overflow: hidden;
    padding: 0;
}


/* 배틀 상단 */

.battle-stage {
    position: relative;
    width: 100%;
    height: calc(100% - 210px);
    min-height: 520px;
    background:
        linear-gradient(
            to bottom,
            #d97745 0%,
            #e79656 35%,
            #f3c37c 36%,
            #f3c37c 100%
        );
    border-bottom: 4px solid #222;
    overflow: hidden;
}

.battle-stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.18) 0px,
            rgba(255,255,255,.18) 3px,
            transparent 3px,
            transparent 9px
        );
    opacity: .25;
}


/* 상대 상태창 */

.enemy-status {
    position: absolute;
    left: 12px;
    top: 28px;
    width: 190px;
    background: #f8f8f8;
    border: 4px solid #222;
    border-radius: 8px 8px 8px 2px;
    padding: 8px 10px;
    z-index: 5;
}

.status-name {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    font-weight: 900;
    margin-bottom: 5px;
}

.hp-bar {
    width: 100%;
    height: 10px;
    background: #ddd;
    border: 2px solid #222;
    border-radius: 999px;
    overflow: hidden;
}

.hp-fill {
    height: 100%;
    width: 100%;
    background: #3abf4a;
}


/* 상대 포켓몬 */

.enemy-platform {
    position: absolute;
    right: 24px;
    top: 150px;
    width: 170px;
    height: 58px;
    background: #d8b07b;
    border-radius: 50%;
    border: 4px solid #8f6a45;
    z-index: 1;
}

.enemy-monster {
    position: absolute;
    right: 52px;
    top: 55px;
    width: 135px;
    height: 135px;
    object-fit: contain;
    z-index: 3;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.18));
}


/* 내 포켓몬 */

.player-platform {
    position: absolute;
    left: 24px;
    bottom: 105px;
    width: 190px;
    height: 62px;
    background: #d8b07b;
    border-radius: 50%;
    border: 4px solid #8f6a45;
    z-index: 1;
}

.player-monster-wrap {
    position: absolute;
    left: 28px;
    bottom: 130px;
    width: 150px;
    height: 130px;
    overflow: hidden;
    z-index: 3;
}

.player-monster {
    width: 230px;
    height: 150px;
    object-fit: cover;
    object-position: 85% center;
    transform: translateX(-82px);
    filter: drop-shadow(0 8px 0 rgba(0,0,0,.18));
}

.player-status {
    position: absolute;
    right: 12px;
    bottom: 118px;
    width: 190px;
    background: #f8f8f8;
    border: 4px solid #222;
    border-radius: 8px 8px 2px 8px;
    padding: 8px 10px;
    z-index: 5;
}

.hp-number {
    margin-top: 4px;
    text-align: right;
    font-size: 13px;
    font-weight: 900;
}


/* 배틀 하단 */

.battle-bottom {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 210px;
    background: #f1f1f1;
    border-top: 5px solid #222;
    display: flex;
    flex-direction: column;
}

.battle-message {
    margin: 12px;
    padding: 16px;
    min-height: 92px;
    background: white;
    border: 4px solid #222;
    border-radius: 8px;
    font-size: 19px;
    font-weight: 900;
    line-height: 1.6;
}

.command-area {
    margin: 0 12px 12px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
}

.catch-button {
    width: 100%;
    height: 58px;
    border: 4px solid #222;
    border-radius: 8px;
    background: #fff;
    color: #111;
    font-size: 22px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.12);
}

.catch-button:active {
    transform: translateY(2px);
    background: #ffe066;
}


/* 엔딩 화면 */

#endingScreen {
    display: none;
    height: 100%;
    padding: 38px 24px;
    text-align: center;
    background:
        radial-gradient(circle at top, #fff1a8, #ffc9de 45%, #bde0fe);
}

.ending-card {
    background: rgba(255,255,255,.92);
    border: 4px solid #333;
    border-radius: 28px;
    padding: 28px 18px;
    margin-top: 30px;
}

.ending-title {
    font-size: 38px;
    font-weight: 900;
    line-height: 1.35;
    margin: 16px 0;
}

.ending-sub {
    font-size: 18px;
    font-weight: 800;
    line-height: 1.6;
}

.ending-imgs {
    display: flex;
    justify-content: center;
    gap: 14px;
    align-items: center;
    margin-top: 20px;
}

.ending-imgs img {
    width: 120px;
    height: 120px;
    object-fit: contain;
}

.ending-dog {
    border-radius: 24px;
    object-fit: cover !important;
}
</style>
</head>


<body>

<div class="phone">

    <!-- 시작 화면 -->
    <section id="startScreen">
        <div class="start-title">
            도뤵이의<br>
            숲속 생일 RPG
        </div>

        <div class="start-text">
            마을을 지나 숲으로 들어가면<br>
            특별한 야생 포켓몬을 만날 수 있다.
        </div>

        <button class="main-button" id="startButton">
            게임 시작
        </button>
    </section>


    <!-- 맵 화면 -->
    <section id="mapScreen">

        <div class="map" id="map">

            <div class="top-ui">
                방향키를 눌러 위쪽 숲 입구로 올라가세요.<br>
                동굴 앞까지 가면 야생 포켓몬이 나타납니다.
            </div>

            <div class="player" id="player"></div>

        </div>

        <div class="controls">
            <button class="ctrl up" data-dir="up">▲</button>
            <button class="ctrl left" data-dir="left">◀</button>
            <button class="ctrl right" data-dir="right">▶</button>
            <button class="ctrl down" data-dir="down">▼</button>
        </div>

        <div class="hint">
            노트북이면<br>
            키보드 방향키도 가능
        </div>

    </section>


    <!-- 배틀 화면 -->
    <section id="battleScreen">

        <div class="battle-stage">

            <div class="enemy-status">
                <div class="status-name">
                    <span>나몰빼미</span>
                    <span>Lv.24</span>
                </div>

                <div class="hp-bar">
                    <div class="hp-fill"></div>
                </div>
            </div>

            <div class="enemy-platform"></div>

            <img
                src="namol.png"
                class="enemy-monster"
                alt="야생 나몰빼미"
            >

            <div class="player-platform"></div>

            <div class="player-monster-wrap">
                <img
                    src="harueng.png"
                    class="player-monster"
                    alt="하뤵"
                >
            </div>

            <div class="player-status">
                <div class="status-name">
                    <span>하뤵</span>
                    <span>Lv.24</span>
                </div>

                <div class="hp-bar">
                    <div class="hp-fill"></div>
                </div>

                <div class="hp-number">
                    91 / 91
                </div>
            </div>

        </div>

        <div class="battle-bottom">

            <div class="battle-message" id="battleText">
                야생 나몰빼미가 나타났다!<br>
                하뤵은 가만히 바라보고 있다.
            </div>

            <div class="command-area">
                <button class="catch-button" id="catchButton">
                    잡는다
                </button>
            </div>

        </div>

    </section>


    <!-- 엔딩 화면 -->
    <section id="endingScreen">

        <div class="ending-card">

            <div style="font-size:64px;">
                🎉
            </div>

            <div class="ending-title">
                도뤵아<br>
                생일축하해
            </div>

            <div class="ending-sub">
                야생 나몰빼미를 잡았다!<br>
                하뤵과 함께 생일 퀘스트 완료.
            </div>

            <div class="ending-imgs">
                <img src="namol.png" alt="나몰빼미">
                <img src="harueng.png" class="ending-dog" alt="하뤵">
            </div>

        </div>

    </section>

</div>


<script>
const startScreen = document.getElementById("startScreen");
const mapScreen = document.getElementById("mapScreen");
const battleScreen = document.getElementById("battleScreen");
const endingScreen = document.getElementById("endingScreen");

const startButton = document.getElementById("startButton");
const catchButton = document.getElementById("catchButton");
const player = document.getElementById("player");

let x = 205;
let y = 700;
let encountered = false;

function showScreen(screen) {
    startScreen.style.display = "none";
    mapScreen.style.display = "none";
    battleScreen.style.display = "none";
    endingScreen.style.display = "none";

    screen.style.display = "block";
}

function updatePlayer() {
    player.style.left = x + "px";
    player.style.top = y + "px";

    player.classList.add("walk");

    setTimeout(function() {
        player.classList.remove("walk");
    }, 220);

    checkEncounter();
}

function movePlayer(dir) {
    const step = 28;

    if (dir === "up") {
        y -= step;
    }

    if (dir === "down") {
        y += step;
    }

    if (dir === "left") {
        x -= step;
    }

    if (dir === "right") {
        x += step;
    }

    if (x < 20) x = 20;
    if (x > 385) x = 385;
    if (y < 40) y = 40;
    if (y > 735) y = 735;

    updatePlayer();
}

function checkEncounter() {
    if (encountered) return;

    if (y <= 95 && x >= 170 && x <= 270) {
        encountered = true;

        setTimeout(function() {
            showScreen(battleScreen);
        }, 450);
    }
}

startButton.addEventListener("click", function() {
    showScreen(mapScreen);
    updatePlayer();
});

document.querySelectorAll(".ctrl").forEach(function(button) {
    button.addEventListener("click", function() {
        movePlayer(button.dataset.dir);
    });
});

document.addEventListener("keydown", function(e) {
    if (mapScreen.style.display !== "block") return;

    if (
        e.key === "ArrowUp" ||
        e.key === "ArrowDown" ||
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight"
    ) {
        e.preventDefault();
    }

    if (e.key === "ArrowUp") movePlayer("up");
    if (e.key === "ArrowDown") movePlayer("down");
    if (e.key === "ArrowLeft") movePlayer("left");
    if (e.key === "ArrowRight") movePlayer("right");
});

catchButton.addEventListener("click", function() {
    catchButton.disabled = true;
    catchButton.innerText = "잡는 중...";

    setTimeout(function() {
        showScreen(endingScreen);
    }, 900);
});
</script>

</body>
</html>
